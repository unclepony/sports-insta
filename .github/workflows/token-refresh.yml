# 인스타 장기 토큰(60일)을 매주 연장한다. 새 토큰은 IG_TOKEN_KEY 로 암호화해 data/ig-token.enc 에 커밋한다
# (Secrets 를 다시 쓰려면 별도 개인 토큰이 필요해서, 암호화 파일로 대신한다). 로그에는 토큰을 남기지 않는다.
# 필요: Secrets IG_ACCESS_TOKEN(처음 한 번), IG_TOKEN_KEY
name: ig-token-refresh

on:
  schedule:
    - cron: '0 1 * * 1' # 매주 월 10:00 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 연장 후 암호화 저장
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_TOKEN_KEY: ${{ secrets.IG_TOKEN_KEY }}
        run: |
          [ -z "$IG_TOKEN_KEY" ] && { echo "::warning::IG_TOKEN_KEY 없음 — 건너뜀"; exit 0; }
          cur="$IG_ACCESS_TOKEN"
          if [ -f data/ig-token.enc ]; then
            cur="$(openssl enc -d -aes-256-cbc -pbkdf2 -in data/ig-token.enc -pass env:IG_TOKEN_KEY 2>/dev/null || echo "$IG_ACCESS_TOKEN")"
          fi
          [ -z "$cur" ] && { echo "토큰 없음 — 건너뜀"; exit 0; }
          echo "::add-mask::$cur"
          # 발급 후 24시간이 안 됐거나 일시 오류면 이번 주는 건너뛴다(다음 주에 다시, 토큰은 60일 유효)
          new="$(IG_ACCESS_TOKEN="$cur" node src/ig-refresh.mjs 2>"$RUNNER_TEMP/err")" || { echo "::warning::토큰 연장 실패 — $(cat "$RUNNER_TEMP/err" | head -c 200)"; exit 0; }
          echo "::add-mask::$new"
          # 만료 예정일(연장 시점 + 60일)을 남겨 상태 보고에 쓴다
          TZ=Asia/Seoul date -d '+60 days' +%F > data/ig-token-expires.txt
          mkdir -p data
          printf '%s' "$new" | openssl enc -aes-256-cbc -pbkdf2 -salt -out data/ig-token.enc -pass env:IG_TOKEN_KEY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ig-token.enc data/ig-token-expires.txt
          git diff --cached --quiet || git commit -m "인스타 토큰 연장(암호화) $(TZ=Asia/Seoul date +%F)"
          git pull --rebase -q && git push

      # 스레드 토큰도 같은 방식(data/threads-token.enc, 같은 IG_TOKEN_KEY)으로 연장
      - name: 스레드 토큰 연장 후 암호화 저장
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          IG_TOKEN_KEY: ${{ secrets.IG_TOKEN_KEY }}
        run: |
          [ -z "$IG_TOKEN_KEY" ] && exit 0
          cur="$THREADS_ACCESS_TOKEN"
          if [ -f data/threads-token.enc ]; then
            cur="$(openssl enc -d -aes-256-cbc -pbkdf2 -in data/threads-token.enc -pass env:IG_TOKEN_KEY 2>/dev/null || echo "$THREADS_ACCESS_TOKEN")"
          fi
          [ -z "$cur" ] && { echo "스레드 토큰 없음 — 건너뜀"; exit 0; }
          echo "::add-mask::$cur"
          new="$(THREADS_ACCESS_TOKEN="$cur" node src/th-refresh.mjs 2>"$RUNNER_TEMP/err")" || { echo "::warning::스레드 토큰 연장 실패 — $(cat "$RUNNER_TEMP/err" | head -c 200)"; exit 0; }
          echo "::add-mask::$new"
          TZ=Asia/Seoul date -d '+60 days' +%F > data/threads-token-expires.txt
          printf '%s' "$new" | openssl enc -aes-256-cbc -pbkdf2 -salt -out data/threads-token.enc -pass env:IG_TOKEN_KEY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/threads-token.enc data/threads-token-expires.txt
          git diff --cached --quiet || git commit -m "스레드 토큰 연장(암호화) $(TZ=Asia/Seoul date +%F)"
          git pull --rebase -q && git push
