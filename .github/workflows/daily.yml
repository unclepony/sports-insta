# 매일 인스타 자동 게시: 수집 → 오늘 게시물 고르기·검증·렌더링 → 미디어 공개 URL(GitHub Pages) → 게시 → 지표 → 보고
# 필요한 설정 (없으면 해당 단계는 건너뛰고 '미리보기만'으로 끝난다):
#   Secrets: IG_USER_ID, IG_ACCESS_TOKEN   인스타 게시·지표 (사장님이 넣음, Instagram API with Instagram Login)
#            IG_TOKEN_KEY                  연장한 토큰을 data/ig-token.enc 로 암호화해 두는 키 (token-refresh.yml)
#            OPS_URL, OPS_KEY              운영 보고 (ops.unclepony.com)
#   Variables(선택): MEDIA_BASE_URL — 기본 https://<계정>.github.io/<저장소>
# 미디어는 GitHub Pages 에 그날 것만 올린다(인스타가 공개 URL 에서 가져감). 저장소 설정 → Pages → Source: GitHub Actions.
name: daily-insta

on:
  schedule:
    - cron: '30 23 * * *' # 08:30 KST
    - cron: '30 3 * * *' # 12:30 KST
    - cron: '30 10 * * *' # 19:30 KST (화·목·토는 릴스)
    - cron: '0 13 * * *' # 22:00 KST (릴스 — 초이스골프 쇼츠 하나 더, 2026-10-19 실험 2주)
  workflow_dispatch:
    inputs:
      dry_run:
        description: '게시하지 않고 미리보기만 (1)'
        default: '0'

permissions:
  contents: write
  pages: write
  id-token: write

# 스레드(threads-daily.yml)와 같은 그룹: GitHub Pages 미디어를 서로 덮어쓰지 않게 한 번에 하나씩
concurrency:
  group: pages-media
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
    env:
      MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: unclepony/golf-price
          path: golf-price
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 한글 글꼴(웹 글꼴을 못 받을 때 대비)
        run: sudo apt-get install -y -qq fonts-noto-cjk >/dev/null

      - name: 수집
        env:
          GOLF_PRICE_DIR: golf-price
        run: |
          node src/fetch-tour.mjs || echo "::warning::투어 수집 실패 — 오늘은 용품 게시물만"
          node src/fetch-gear.mjs

      - name: 오늘 게시물 만들기
        run: |
          node src/daily.mjs build
          mkdir -p out/media && touch out/media/.nojekyll

      - name: 미디어 공개 URL 배포 (GitHub Pages)
        uses: actions/upload-pages-artifact@v3
        with:
          path: out/media
      - id: pages
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: 인스타 토큰 준비 (연장된 토큰이 있으면 그것을)
        env:
          IG_TOKEN_KEY: ${{ secrets.IG_TOKEN_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          tok="$IG_ACCESS_TOKEN"
          if [ -f data/ig-token.enc ] && [ -n "$IG_TOKEN_KEY" ]; then
            tok="$(openssl enc -d -aes-256-cbc -pbkdf2 -in data/ig-token.enc -pass env:IG_TOKEN_KEY 2>/dev/null || echo "$IG_ACCESS_TOKEN")"
          fi
          [ -n "$tok" ] && { echo "::add-mask::$tok"; echo "IG_TOKEN=$tok" >> "$GITHUB_ENV"; }
          true

      - name: 게시
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
        run: IG_ACCESS_TOKEN="$IG_TOKEN" node src/daily.mjs publish

      - name: 지표·댓글 수집 (+ ops 대시보드 전송)
        if: always()
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          OPS_URL: ${{ secrets.OPS_URL }}
          OPS_KEY: ${{ secrets.OPS_KEY }}
        run: IG_ACCESS_TOKEN="$IG_TOKEN" node src/daily.mjs insights || echo "::warning::지표 수집 실패"

      - name: 보고
        if: always()
        env:
          OPS_URL: ${{ secrets.OPS_URL }}
          OPS_KEY: ${{ secrets.OPS_KEY }}
        run: node src/daily.mjs report

      - name: 기록 커밋
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports
          git diff --cached --quiet || git commit -m "매일 인스타 $(TZ=Asia/Seoul date +%F)"
          git pull --rebase -q && git push
